name: Compilar APK de Flutter

on:
  push:
    branches:
      - main
  workflow_dispatch:   # permite lanzarlo a mano desde la pestaña Actions

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Verificar que el modelo biométrico existe
        run: test -f assets/mobilefacenet.tflite

      - name: Instalar dependencias
        run: flutter pub get

      # Solo arquitecturas ARM (teléfonos/tablets reales). Evita compilar x86,
      # que es lento y no hace falta.
      - name: Compilar APK release
        run: flutter build apk --release --target-platform android-arm,android-arm64

      - name: Guardar la APK como resultado
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error