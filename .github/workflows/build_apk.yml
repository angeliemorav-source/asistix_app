name: Compilar APK de Flutter

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      GRADLE_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Dorg.gradle.jvmargs=\"-Xmx4g -XX:MaxMetaspaceSize=1g\" -Dorg.gradle.parallel=false"
      JAVA_OPTS: "-Xmx4g -XX:MaxMetaspaceSize=1g"
      _JAVA_OPTIONS: "-Xmx4g -XX:MaxMetaspaceSize=1g"
      KOTLIN_DAEMON_ARGS: "-Xmx4g -XX:MaxMetaspaceSize=1g"

    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Aceptar licencias de Android automáticamente
        run: |
          mkdir -p ${ANDROID_HOME}/licenses
          yes | sdkmanager --licenses || true

      - name: Forzar compatibilidad JVM Target 17 en todas las dependencias
        run: |
          mkdir -p android
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> android/gradle.properties
          echo "org.gradle.parallel=false" >> android/gradle.properties
          
          cat << 'EOF' >> android/build.gradle
          
          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      project.android {
                          compileOptions {
                              sourceCompatibility = JavaVersion.VERSION_17
                              targetCompatibility = JavaVersion.VERSION_17
                          }
                      }
                  }
                  tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                      kotlinOptions {
                          jvmTarget = "17"
                      }
                  }
              }
          }
          EOF

      - name: Instalar dependencias
        run: flutter pub get

      - name: Precompilar dependencias de Flutter
        run: flutter build apk --config-only

      - name: Compilar APK nativa directamente con Gradle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

            # ... (Todo lo anterior se queda igual)

      - name: Reubicar APK en android/app/
        run: |
          mkdir -p android/app/
          cp android/app/build/outputs/apk/release/app-release.apk android/app/app-release.apk

      - name: Guardar la APK como resultado
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: android/app/app-release.apk

