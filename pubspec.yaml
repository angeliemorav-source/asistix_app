  # Versión compatible y disponible en pub.dev
  tflite_flutter: ^0.12.1
  image: ^4.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2

flutter:
  uses-material-design: true
