name: asistix_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^2.0.0
  google_fonts: ^6.3.3
  supabase_flutter: ^2.8.0
  
  # Versiones modernas y estables para la cámara y ML Kit
  camera: ^0.12.2
